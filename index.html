<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Election Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Live Federal Election Commission results map. Electoral votes, state totals and county-level results across the United States. Click a state to zoom into its counties.">
  <meta name="theme-color" content="#003a70">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Federal Election Commission">
  <meta property="og:title" content="FEC Election Center">
  <meta property="og:description" content="Live Federal Election Commission results map. Electoral votes, state totals and county-level results across the United States.">
  <meta property="og:url" content="https://mallardtheducky.github.io/Election-Map/">
  <meta property="og:image" content="https://mallardtheducky.github.io/Election-Map/images/fec-seal.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Seal of the Federal Election Commission">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="FEC Election Center">
  <meta name="twitter:description" content="Live Federal Election Commission results map. Electoral votes, state totals and county-level results across the United States.">
  <meta name="twitter:image" content="https://mallardtheducky.github.io/Election-Map/images/fec-seal.png">

  <script>
    (function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}
    if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    document.documentElement.dataset.theme=t;})();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Playfair+Display:wght@800;900&family=Big+Shoulders+Display:wght@600;700;800;900&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/scoreboard.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/legend.css">
  <link rel="stylesheet" href="css/popup.css">
  <link rel="stylesheet" href="css/winner.css">
  <link rel="stylesheet" href="css/projection.css?v=1">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/theme.css?v=1">
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3"/><path d="M8 21v-7h8v7"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
      <symbol id="i-legend" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2V6Z"/><path d="M9 4v14M15 6v14"/></symbol>
    </defs>
  </svg>

  <div id="loader">
    <div id="loader-content"></div>
  </div>

  <div id="app">

    <header id="header">
      <div class="top-row">
        <div class="title-group">
          <div class="live-badge"><span class="live-dot"></span>Live</div>
          <h1 class="title" id="title"></h1>
          <div class="sync" id="sync" data-state="local"><span class="sync-dot"></span><span id="sync-text">Loading</span></div>
          <span class="reporting" id="reporting">0% of votes counted</span>
          <span class="stat-ind" id="ind-wrap" hidden><span id="name-ind">Independent</span> <span id="pv-ind">0 (0%)</span></span>
        </div>

        <div class="header-controls">
          <button class="btn-icon" id="btn-theme" type="button" title="Toggle light / dark" aria-label="Toggle light or dark mode">
            <svg class="icon icon-sun"><use href="#i-sun"/></svg><svg class="icon icon-moon"><use href="#i-moon"/></svg>
          </button>
          <button class="btn-icon" id="btn-reset" type="button" title="Reset map" aria-label="Reset map">
            <svg class="icon"><use href="#i-fit"/></svg>
          </button>
          <button class="btn-icon" id="btn-refresh" type="button" title="Reload results" aria-label="Reload results">
            <svg class="icon"><use href="#i-refresh"/></svg>
          </button>
          <button class="btn-icon" id="btn-sidebar" type="button" title="State list" aria-label="State list">
            <svg class="icon"><use href="#i-menu"/></svg>
          </button>
        </div>
      </div>

      <div class="scoreboard">
        <div class="candidate-slot" id="avatar-dem"></div>

        <div class="score-main">
          <div class="score-top">
            <div class="cand cand-dem">
              <span class="cand-name" id="name-dem"></span>
              <div class="cand-row">
                <strong class="cand-ev" id="ev-dem">0</strong>
                <span class="cand-stats"><span class="cand-label">electoral college votes</span><span class="cand-votes" id="pv-dem">0 votes</span></span>
              </div>
            </div>

            <div class="cand cand-gop">
              <span class="cand-name" id="name-gop"></span>
              <div class="cand-row">
                <span class="cand-stats"><span class="cand-label">electoral college votes</span><span class="cand-votes" id="pv-gop">0 votes</span></span>
                <strong class="cand-ev" id="ev-gop">0</strong>
              </div>
            </div>
          </div>

          <div class="meter">
            <div class="meter-goal">270 to win</div>
            <div class="progress-bar-wrapper">
              <div class="progress-bar dem" id="bar-dem"></div>
              <div class="progress-bar ind" id="bar-ind"></div>
              <div class="progress-bar gop" id="bar-gop"></div>
              <div class="threshold-marker"></div>
            </div>
          </div>
        </div>

        <div class="candidate-slot" id="avatar-gop"></div>
      </div>
    </header>

    <main id="stage">
      <div id="map"></div>

      <div id="toolbar" role="toolbar" aria-label="Map options">
        <button class="chip" type="button" data-toggle="legend" title="Legend" aria-label="Legend" aria-pressed="false"><svg class="icon"><use href="#i-legend"/></svg><span class="chip-label">Legend</span></button>
        <button class="chip" type="button" data-toggle="small" title="Small states" aria-label="Small states" aria-pressed="false"><svg class="icon"><use href="#i-grid"/></svg><span class="chip-label">Small states</span></button>
        <button class="chip" type="button" data-toggle="counties" title="All counties" aria-label="All counties" aria-pressed="false"><svg class="icon"><use href="#i-map"/></svg><span class="chip-label">All counties</span></button>
        <button class="chip" type="button" id="btn-save-counties" hidden title="Save these county results as this year's history" aria-label="Save counties"><svg class="icon"><use href="#i-save"/></svg><span class="chip-label">Save counties</span></button>
      </div>

      <div id="small-states"></div>

      <div class="zoom-controls">
        <button class="btn-icon" id="zoom-in" type="button" aria-label="Zoom in">
          <svg class="icon"><use href="#i-plus"/></svg>
        </button>
        <button class="btn-icon" id="zoom-out" type="button" aria-label="Zoom out">
          <svg class="icon"><use href="#i-minus"/></svg>
        </button>
      </div>

      <div id="legend-panel"></div>

      <div id="winner-banner">
        <svg class="icon"><use href="#i-check"/></svg>
        <span id="winner-text"></span>
      </div>

      <div id="tooltip"></div>
      <div id="popup"></div>

      <aside id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">State results</span>
          <button class="close-sidebar" id="sidebar-close" type="button" aria-label="Close">
            <svg class="icon"><use href="#i-close"/></svg>
          </button>
        </div>

        <div class="search-container">
          <input type="text" id="state-search" class="search-input" placeholder="Search for a state" autocomplete="off">
        </div>

        <ul class="state-list" id="state-list"></ul>
      </aside>
    </main>

  </div>

  <script>
    window.addEventListener('error', function (e) {
      var box = document.getElementById('loader-content');
      if (!box || box.querySelector('.spinner') === null && box.children.length) return;
      box.innerHTML = '<div class="loader-error-title">The map failed to start</div><div class="loader-error-detail"></div>';
      box.querySelector('.loader-error-detail').textContent = (e.message || 'Script error') + (e.filename ? ' (' + e.filename.split('/').slice(-3).join('/') + ':' + e.lineno + ')' : '');
    }, true);
  </script>
  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="vendor/confetti.browser.js"></script>
  <script type="module" src="js/main.js?v=5"></script>
</body>
</html>
